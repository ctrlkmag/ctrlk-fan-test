<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ctrl+K 아이돌 팬 성향 테스트</title>
<meta name="description" content="나는 어떤 덕질 유형일까? Ctrl+K Magazine 아이돌 팬 성향 테스트">
<link rel="icon" type="image/svg+xml" href="logo/Logo_black.svg">
<script>
  // 로고 이미지 로드 실패 시 대체 처리 (헤드에서 정의해 각 이미지보다 먼저 준비되도록 함)
  function handleLogoError(img){
    img.style.display = "none";
    var fbId = img.dataset.fallback;
    if(fbId){
      var fb = document.getElementById(fbId);
      if(fb) fb.style.display = "block";
    }
  }
</script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-subset.css">
<style>
  :root{
    --pink:#FEC3EF;
    --dark:#191919;
    --white:#FFFFFF;
    --gray:#8a8a8a;
    --card:#232323;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--dark);
    color:var(--white);
    font-family:'Pretendard', sans-serif;
    font-weight:400;
    letter-spacing:-0.02em;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    background:var(--dark);
  }
  header.site-header{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:22px 0 14px;
    position:sticky;
    top:0;
    z-index:100;
    background:var(--dark);
  }
  header.site-header img{
    height:20px;
    width:auto;
    display:block;
  }
  header.site-header .logo-fallback{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--pink);
    display:none;
  }
  .screen{
    display:none;
    flex:1;
    flex-direction:column;
    padding:0 24px 40px;
    animation:fadeIn .35s ease;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- START SCREEN ---------- */
  #screen-start{flex:1;}
  .start-content{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    justify-content:center;
  }
  .start-logo{
    height:56px;
    width:auto;
    margin-bottom:22px;
  }
  .tag-pill{
    color:var(--white);
    font-weight:700;
    font-size:12px;
    margin-bottom:20px;
  }
  #screen-start h1{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:34px;
    line-height:1.3;
    margin:0 0 16px;
    color:var(--white);
  }
  #screen-start h1 span{color:var(--pink);}
  #screen-start p.desc{
    font-size:15px;
    line-height:1.7;
    color:#cfcfcf;
    margin:0 0 34px;
  }
  .btn-primary{
    background:var(--pink);
    color:var(--dark);
    border:none;
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:17px;
    padding:17px 0;
    width:100%;
    border-radius:30px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 20px rgba(254,195,239,0.25);
  }
  .btn-primary:active{transform:scale(0.97);}
  .btn-secondary{
    background:transparent;
    color:var(--white);
    border:1.5px solid #444;
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:15px 0;
    width:100%;
    border-radius:30px;
    cursor:pointer;
    margin-top:2px;
  }
  .btn-secondary:active{transform:scale(0.97);}
  .btn-outline-pink{
    background:transparent;
    color:var(--pink);
    border:1.5px solid var(--pink);
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:15px 0;
    width:100%;
    border-radius:30px;
    cursor:pointer;
    margin-top:2px;
  }
  .btn-outline-pink:active{transform:scale(0.97);}

  footer.site-footer{
    text-align:center;
    padding:26px 0 44px;
  }
  footer.site-footer a{
    color:var(--pink);
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  footer.site-footer a:hover{text-decoration:underline;}

  /* ---------- QUIZ SCREEN ---------- */
  #screen-quiz{padding-top:8px;}
  .progress-wrap{
    margin:10px 0 6px;
  }
  .progress-info{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#999;
    margin-bottom:8px;
    font-weight:700;
  }
  .progress-info span.current{color:var(--pink);}
  .progress-track{
    width:100%;
    height:8px;
    background:#2c2c2c;
    border-radius:10px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--pink), #ffd9f7);
    border-radius:10px;
    width:0%;
    transition:width .35s ease;
  }
  .question-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    padding-top:56px;
  }
  .quiz-logo{
    height:30px;
    width:auto;
    margin-top:20px;
    margin-bottom:-39px;
  }
  .q-number{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    color:var(--pink);
    font-size:16px;
    margin-bottom:10px;
  }
  .q-text{
    font-family:'Pretendard', sans-serif;
    font-size:22px;
    font-weight:700;
    line-height:1.45;
    margin-bottom:34px;
    color:var(--white);
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .choice-btn{
    background:var(--card);
    border:2px solid #333;
    color:var(--white);
    text-align:left;
    padding:18px 18px;
    border-radius:16px;
    font-size:15px;
    font-weight:500;
    line-height:1.5;
    cursor:pointer;
    transition:all .15s ease;
  }
  .choice-btn:hover{
    border-color:var(--pink);
    background:#2a2426;
  }
  .choice-btn:active{
    transform:scale(0.98);
    background:var(--pink);
    color:var(--dark);
  }
  .back-link{
    align-self:flex-start;
    color:#888;
    font-size:13px;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px 0;
    margin-top:32px;
  }
  .back-link:hover{color:var(--pink);}

  /* ---------- RESULT SCREEN ---------- */
  #screen-result{padding-top:10px;}
  .result-capture{
    background:linear-gradient(160deg, var(--pink) 0%, #ffe3fb 100%);
    border-radius:26px;
    padding:50px 24px 40px;
    color:var(--dark);
    text-align:center;
    margin-top:10px;
  }
  .result-logo{
    height:31px;
    width:auto;
    margin-bottom:10px;
  }
  .result-capture .cap-tag{
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#8a4d80;
    margin-bottom:2px;
  }
  .cap-tag-sub{
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    color:#8a4d80;
    opacity:.75;
    margin-bottom:16px;
  }
  .result-emoji{
    font-size:52px;
    margin-bottom:10px;
    line-height:1;
  }
  .result-title{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1.35;
    margin:0 0 14px;
    color:var(--dark);
  }
  .result-code{
    display:inline-block;
    background:var(--dark);
    color:var(--pink);
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .result-suffix{
    font-size:12px;
    font-weight:700;
    color:#8a4d80;
    margin-bottom:18px;
  }
  .result-desc{
    font-size:14.5px;
    line-height:1.75;
    color:#3a2a37;
    text-align:left;
    margin-bottom:0;
  }
  .match-card{
    background:var(--card);
    border-radius:20px;
    padding:22px 20px;
    margin-top:18px;
    text-align:left;
  }
  .match-card .match-label{
    font-size:12px;
    font-weight:700;
    color:var(--pink);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .match-card .match-title{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--white);
    margin-bottom:10px;
  }
  .match-card .match-desc{
    font-size:13.5px;
    line-height:1.7;
    color:#c9c9c9;
  }
  .result-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:26px;
  }
  .toast{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--white);
    color:var(--dark);
    padding:12px 22px;
    border-radius:30px;
    font-size:13px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:999;
    white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (min-width:480px){
    .app{border-left:1px solid #262626; border-right:1px solid #262626;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="site-header">
    <img id="logo-img" class="wordmark-logo" src="logo/ctrlkmag_pink.svg" alt="Ctrl+K Magazine" data-fallback="logo-fallback" onerror="handleLogoError(this)">
    <span id="logo-fallback" class="logo-fallback">Ctrl+K</span>
  </header>

  <!-- ================= START SCREEN ================= -->
  <section id="screen-start" class="screen active">
    <div class="start-content">
      <img class="start-logo" src="logo/Logo.svg" alt="Ctrl+K" onerror="handleLogoError(this)">
      <div class="tag-pill">Ctrl+K Magazine · FAN TEST</div>
      <h1>내 <span>덕질 성향</span>은<br>어떤 타입일까?</h1>
      <p class="desc">
        덕질 장소부터 덕심 공개 범위, 소통 스타일, 덕메 관계까지<br>
        13가지 질문으로 알아보는 <b>나의 찐 덕질 유형</b>.<br>
        16가지 결과 중 내 타입을 지금 확인해보세요.
      </p>

      <button class="btn-primary" onclick="startQuiz()" style="margin-top:8px;">테스트 시작하기</button>
    </div>
  </section>

  <!-- ================= QUIZ SCREEN ================= -->
  <section id="screen-quiz" class="screen">
    <div class="progress-wrap">
      <div class="progress-info">
        <span><span class="current" id="q-current">1</span> / <span id="q-total">13</span></span>
        <span id="q-percent">8%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="question-wrap">
      <div class="q-number" id="q-num-label">Q1.</div>
      <div class="q-text" id="q-text">질문 텍스트</div>
      <div class="choices">
        <button class="choice-btn" id="choice-a" onclick="selectAnswer('A')"></button>
        <button class="choice-btn" id="choice-b" onclick="selectAnswer('B')"></button>
      </div>
    </div>

    <button class="back-link" id="back-btn" onclick="goBack()">← 이전 질문</button>
    <img class="quiz-logo" src="logo/Logo.svg" alt="Ctrl+K" onerror="handleLogoError(this)">
  </section>

  <!-- ================= RESULT SCREEN ================= -->
  <section id="screen-result" class="screen">
    <div class="result-capture" id="result-capture">
      <img class="result-logo" src="logo/Logo_black.svg" alt="Ctrl+K" onerror="handleLogoError(this)" data-fallback="result-logo-fallback">
      <div class="cap-tag" id="result-logo-fallback" style="display:none;">Ctrl+K Magazine</div>
      <div class="cap-tag-sub">Ctrl+K Magazine · FAN TEST</div>
      <div class="result-emoji" id="result-emoji">💌</div>
      <h2 class="result-title" id="result-title">결과 타입</h2>
      <div class="result-code" id="result-code">CODE</div>
      <div class="result-suffix" id="result-suffix"></div>
      <p class="result-desc" id="result-desc">결과 설명</p>
    </div>

    <div class="match-card">
      <div class="match-label">💘 찰떡 궁합 유형</div>
      <div class="match-title" id="match-title">궁합 타입</div>
      <div class="match-desc" id="match-desc">궁합 설명</div>
    </div>

    <div class="result-actions">
      <button class="btn-primary" onclick="saveResultImage()">결과 이미지 저장하기</button>
      <button class="btn-outline-pink" onclick="shareResult()">테스트 공유하기</button>
      <button class="btn-secondary" onclick="restartQuiz()">테스트 다시하기</button>
    </div>
    <img class="quiz-logo" src="logo/Logo.svg" alt="Ctrl+K" onerror="handleLogoError(this)">
  </section>

  <footer class="site-footer">
    <a href="https://www.instagram.com/ctrlk.mag/" target="_blank" rel="noopener">
      📷 Ctrl+K Magazine 인스타그램 바로가기
    </a>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* =========================================================
   Ctrl+K 아이돌 팬 성향 테스트
   축1: H(가성비 안방덕질형 — 안방파+가성비) / O(과소비 직관러형 — 직관파+과소비)
        ※ 덕질 장소 + 소비 성향을 하나로 합친 축. axis:0 질문 작성 시
          "어디서 덕질하는지"뿐 아니라 "얼마나/어떻게 소비하는지"도 함께 반영할 것
   축2: C(일코형 — 덕심을 드러내지 않음) / B(자랑형 — 덕심을 적극 공개)
   축3: D(데일리/일상소통형) / A(알맹이/사진형)
   축4: S(같순좋아형) / J(같순견제형)
   축5(보너스): L(장기연애파) / T(환승연애파) — 유형은 그대로, 결과 코드 뒤에 -L / -T 로만 붙음
========================================================= */

const QUESTIONS = [
  { axis:0, text:"갑작스럽겠지만 새로운 최애가 생겼습니다...",
    a:{label:"당장 보러 가야해... 멤버십 가입! 스케줄 확인!", v:"O"},
    b:{label:"일단 사진 저장하고... 직캠 뜬 거 봐야지...", v:"H"} },
  { axis:1, text:"아이돌 세계를 전혀 모르는 친구를 만났다! 요즘 어떻게 지내냐고 물었을 때 나의 반응은?",
    a:{label:"나 요즘 OTT 보고, 유튜브 보고 그러지 뭐...", v:"C"},
    b:{label:"지난주 콘서트 다녀왔어!!! oo이 너무 잘하고 멋있어서 또 반함", v:"B"} },
  { axis:2, text:"최애의 SNS 업로드, 어떤 스타일이 좋아?",
    a:{label:"매일매일 짧은 셀카나 한마디라도 자주 올려줬으면", v:"D"},
    b:{label:"자주 안 와도 되니까, 올 때 제대로 화보처럼 찍어서", v:"A"} },
  { axis:3, text:"트친소를 했다! “저도 최애가 같아요!”라고 하면?",
    a:{label:"너무 반가워! 바로 맞팔하고 같이 최애 덕질 시작", v:"S"},
    b:{label:"헉… 반갑긴 한데 살짝 아쉽다..ㅜㅜ 교환할 때도 그렇고... 뭔가 신경 쓰인다", v:"J"} },
  { axis:0, text:"최애 콘서트 티켓팅 날, 나의 상태는?",
    a:{label:"떨린다… 일단 자리 확보가 목표! 못 잡으면 어쩔 수 없다…", v:"H"},
    b:{label:"무조건 최대한 앞자리 가야 하는데 어떡하지 일단 대리 구하고… 계정 하나 더 만들어야 하나? ㅜㅜ", v:"O"} },
  { axis:1, text:"최애의 신곡이 나왔다!",
    a:{label:"바로 카카오톡 프로필 뮤직 설정하고, 인스타 스토리에 듣고 있는 노래 캡쳐해서 올린다.", v:"B"},
    b:{label:"노래가 너무 좋아서 자랑하고 싶지만... 사회적 체면을 위해 은근슬쩍 티 낼 수 있는 방법을 찾는다.", v:"C"} },
  { axis:2, text:"이상적인 브이로그 업로드 주기는?",
    a:{label:"짧고 가벼워도 매일 올라오는 게 최고", v:"D"},
    b:{label:"한 달에 한 번이어도 고퀄리티 알맹이면 충분", v:"A"} },
  { axis:3, text:"같은 최애인 덕메가 콘서트 맨 앞자리를 잡았다!",
    a:{label:"헐 미쳤다. 어떻게 하면 가서 깁 받을 수 있을지 같이 고민한다.", v:"S"},
    b:{label:"아 부러워… 솔직히 조금 부러운 감정이 든다", v:"J"} },
  { axis:0, text:"티켓팅에 실패했다...",
    a:{label:"어쩔 수 없지ㅜ 티켓팅 사이트 들락날락하면서 취소표 풀린게 있나 수시로 체크하고 없으면 포기한다.", v:"H"},
    b:{label:"바로 X(트위터), 거래 사이트를 서치해서 표를 확보해둔다. 얼마가 들든지 상관없다! 넌 내 꺼야...", v:"O"} },
  { axis:1, text:"최애 팝업스토어나 전시회에 다녀온 뒤, 인증샷을 남길 때 나의 스타일은?",
    a:{label:"최대한 티 안 나는 배경이나 뒷모습 위주로 찍어서, 아는 사람만 알아챌 수 있도록 한다.", v:"C"},
    b:{label:"최애 사진 앞에서 포즈를 취하거나 포카와 인형을 들고 열정적으로 찍는다.", v:"B"} },
  { axis:2, text:"최애 인스타그램에 바라는 점은?",
    a:{label:"셀카 한 장이라도 매일매일 올려주는 다정함", v:"D"},
    b:{label:"화보 같은 사진 몇 장, 가끔이어도 완벽하게", v:"A"} },
  { axis:3, text:"팬덤 안에서 나의 태도는?",

// 궁합: 덕질 장소+소비 성향(축1)만 반대인 타입끼리 매칭 (나머지 성향 100% 동일)
function getMatchCode(code){
  const flipped = (code[0]==="H" ? "O" : "H") + code.slice(1);
  return flipped;
}
function getMatchDesc(matchTitle){
  return `덕질 장소와 소비 스타일만 다를 뿐, 덕심을 드러내는 방식이나 소통 스타일, 팬덤 내 태도까지 놀랍도록 닮은 케미 조합이에요. '${matchTitle}'과 함께라면 현장 후기와 집콕 감상평, 영수증 자랑까지 나누며 서로의 덕질 인생을 더 풍성하게 채워줄 수 있어요.`;
}

let currentQ = 0;
let answers = []; // {axis, v}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startQuiz(){
  currentQ = 0;
  answers = [];
  showScreen("screen-quiz");
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[currentQ];
  document.getElementById("q-current").textContent = currentQ+1;
  const total = QUESTIONS.length;
  document.getElementById("q-total").textContent = total;
  document.getElementById("q-percent").textContent = Math.round((currentQ/total)*100)+"%";
  document.getElementById("progress-fill").style.width = (currentQ/total*100)+"%";
  document.getElementById("q-num-label").textContent = "Q"+(currentQ+1)+".";
  document.getElementById("q-text").textContent = q.text;
  document.getElementById("choice-a").textContent = q.a.label;
  document.getElementById("choice-b").textContent = q.b.label;
  document.getElementById("back-btn").style.visibility = currentQ===0 ? "hidden" : "visible";
}

function selectAnswer(which){
  const q = QUESTIONS[currentQ];
  const chosen = which==="A" ? q.a.v : q.b.v;
  answers[currentQ] = { axis:q.axis, v:chosen };

  if(currentQ < QUESTIONS.length-1){
    currentQ++;
    renderQuestion();
  } else {
    document.getElementById("progress-fill").style.width = "100%";
    document.getElementById("q-percent").textContent = "100%";
    setTimeout(showResult, 250);
  }
}

function goBack(){
  if(currentQ>0){
    currentQ--;
    renderQuestion();
  }
}

function computeCode(){
  const axisPairs = [["H","O"],["C","B"],["D","A"],["S","J"]];
  const tally = [{},{},{},{}];
  answers.forEach(a=>{
    if(a.axis<4) tally[a.axis][a.v] = (tally[a.axis][a.v]||0) + 1;
  });
  let code = "";
  for(let i=0;i<4;i++){
    const [x,y] = axisPairs[i];
    code += (tally[i][x]||0) >= (tally[i][y]||0) ? x : y;
  }
  return code;
}

// 5번째 축(장기연애 L / 환승연애 T): 결과 유형은 바꾸지 않고 코드 뒤에 -L / -T 꼬리표로만 붙음
function computeSuffix(){
  const a = answers.find(x=>x && x.axis===4);
  return a ? a.v : "";
}

function showResult(){
  const code = computeCode();
  const result = RESULTS[code];
  const matchCode = getMatchCode(code);
  const matchResult = RESULTS[matchCode];

  document.getElementById("result-emoji").textContent = result.emoji;
  document.getElementById("result-title").textContent = result.title;
  const suffix = computeSuffix();
  document.getElementById("result-code").textContent = suffix ? code + "-" + suffix : code;
  document.getElementById("result-suffix").textContent = SUFFIX_INFO[suffix] || "";
  document.getElementById("result-desc").textContent = result.desc;
  document.getElementById("match-title").textContent = matchResult.title + " (" + matchCode + ")";
  document.getElementById("match-desc").textContent = getMatchDesc(matchResult.title);

  showScreen("screen-result");
}

function restartQuiz(){
  showScreen("screen-start");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function saveResultImage(){
  const node = document.getElementById("result-capture");
  if(typeof html2canvas === "undefined"){
    showToast("이미지 저장 기능을 불러오지 못했어요");
    return;
  }
  html2canvas(node, {backgroundColor:"#FEC3EF", scale:2}).then(canvas=>{
    const link = document.createElement("a");
    link.download = "ctrlk_fan_test_result.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    showToast("결과 이미지가 저장되었어요!");
  }).catch(()=>{
    showToast("이미지 저장에 실패했어요");
  });
}

function shareResult(){
  const title = document.getElementById("result-title").textContent;
  const shareData = {
    title: "Ctrl+K 아이돌 팬 성향 테스트",
    text: `나의 덕질 성향은 "${title}"! 너도 테스트 해봐요 💌`,
    url: window.location.href
  };
  if(navigator.share){
    navigator.share(shareData).catch(()=>{});
  } else {
    const text = `${shareData.text}\n${shareData.url}`;
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(()=>{
        showToast("링크가 복사되었어요! 공유해보세요");
      }).catch(()=>{
        showToast(text);
      });
    } else {
      showToast("공유 링크: " + shareData.url);
    }
  }
}
